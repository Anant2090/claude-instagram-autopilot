name: Generate English and Hindi Reels with Voice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install audio dependencies
        run: python -m pip install --upgrade pip numpy scipy

      - name: Check required secrets
        run: |
          test -n "$ANTHROPIC_API_KEY" || (echo "Missing ANTHROPIC_API_KEY secret" && exit 1)
          test -n "$CARTESIA_API_KEY" || (echo "Missing CARTESIA_API_KEY secret" && exit 1)
          test -n "$CARTESIA_VOICE_ID" || (echo "Missing CARTESIA_VOICE_ID secret" && exit 1)

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate English Reel script
        run: |
          claude -p 'Read auto-generate/config.yml. Create an original English Instagram Reel for @aiforall.daily about ChatGPT, Perplexity, Canva AI, Gamma, and NotebookLM. Return ONLY JSON with this shape:
          {"handle":"@aiforall.daily","narration":"A concise natural voiceover script, about 45 to 55 spoken words.","slides":[{"kind":"hook","tag":"...","headline":"..."},{"kind":"tool","n":1,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":2,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":3,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":4,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":5,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"cta","emphasis":"FOLLOW","body":"..."}]}. Exactly 7 slides. Short readable on-screen text. Tool slides need accurate simple information in body, plus realistic prompt and concise illustrative result. Never claim a simulation is a real product screenshot or actual generated result. Narration speaks all five tools and ends with follow CTA. No Markdown.' --output-format text --dangerously-skip-permissions > /tmp/english-response.txt

      - name: Generate Hindi Reel script
        run: |
          claude -p 'Read auto-generate/config.yml. Create an original natural Hindi Instagram Reel for @aiforall.daily about ChatGPT, Perplexity, Canva AI, Gamma, and NotebookLM. Return ONLY JSON with this shape:
          {"handle":"@aiforall.daily","narration":"पूरा नैचुरल हिंदी वॉइसओवर, लगभग 45 से 55 बोले गए शब्द।","slides":[{"kind":"hook","tag":"...","headline":"..."},{"kind":"tool","n":1,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":2,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":3,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":4,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"tool","n":5,"headline":"...","emphasis":"...","body":"...","demoLabel":"...","demoPrompt":"...","demoResult":"..."},{"kind":"cta","emphasis":"FOLLOW","body":"..."}]}. Exactly 7 slides. Spoken narration must be natural Hindi in Devanagari; keep product names in English. Each tool slide needs accurate simple information, a practical prompt and a concise illustrative result. Do not present simulation as real product footage or verified output. End with a follow CTA. No Markdown.' --output-format text --dangerously-skip-permissions > /tmp/hindi-response.txt

      - name: Validate scripts and attach optional real demo recordings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const map = {1:'demos/chatgpt.mp4',2:'demos/perplexity.mp4',3:'demos/canva-ai.mp4',4:'demos/gamma.mp4',5:'demos/notebooklm.mp4'};
          function parse(input, output) {
            const raw=fs.readFileSync(input,'utf8'), start=raw.indexOf('{'), end=raw.lastIndexOf('}');
            if(start<0||end<=start) throw new Error('No JSON in '+input);
            const d=JSON.parse(raw.slice(start,end+1));
            if(d.handle!=='@aiforall.daily'||typeof d.narration!=='string'||d.narration.trim().length<40) throw new Error('Invalid handle/narration '+input);
            if(!Array.isArray(d.slides)||d.slides.length!==7) throw new Error('Expected 7 slides '+input);
            if(d.slides[0].kind!=='hook'||d.slides[6].kind!=='cta'||d.slides.slice(1,6).some(s=>s.kind!=='tool'||!s.demoPrompt||!s.demoResult)) throw new Error('Invalid slide structure '+input);
            for(const s of d.slides) if(s.kind==='tool'&&fs.existsSync('remotion/public/'+map[s.n])) s.demoVideo=map[s.n];
            d.audioFile=output.includes('english')?'audio/english-mix.wav':'audio/hindi-mix.wav';
            fs.mkdirSync('remotion/public/audio',{recursive:true});
            fs.mkdirSync('remotion/out',{recursive:true});
            fs.writeFileSync(output,JSON.stringify(d,null,2));
          }
          parse('/tmp/english-response.txt','remotion/english-carousel.json');
          parse('/tmp/hindi-response.txt','remotion/hindi-carousel.json');
          NODE

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Generate English narration and mastered audio
        run: |
          python remotion/scripts/audio.py --input remotion/english-carousel.json --output remotion/public/audio/english-voice.wav --language en
          python remotion/scripts/mix.py --voice remotion/public/audio/english-voice.wav --output remotion/public/audio/english-mix.wav

      - name: Render English video and finalize audio
        working-directory: remotion
        run: |
          npx remotion render src/index.tsx Reel out/english-video.mp4 --props=./english-carousel.json --muted
          python scripts/finalize.py --video out/english-video.mp4 --audio public/audio/english-mix.wav --output out/english-reel.mp4

      - name: Generate Hindi narration and mastered audio
        run: |
          python remotion/scripts/audio.py --input remotion/hindi-carousel.json --output remotion/public/audio/hindi-voice.wav --language hi
          python remotion/scripts/mix.py --voice remotion/public/audio/hindi-voice.wav --output remotion/public/audio/hindi-mix.wav

      - name: Render Hindi video and finalize audio
        working-directory: remotion
        run: |
          npx remotion render src/index.tsx Reel out/hindi-video.mp4 --props=./hindi-carousel.json --muted
          python scripts/finalize.py --video out/hindi-video.mp4 --audio public/audio/hindi-mix.wav --output out/hindi-reel.mp4

      - name: Upload final English and Hindi Reels
        uses: actions/upload-artifact@v4
        with:
          name: ai-for-all-final-english-and-hindi-reels
          path: |
            remotion/out/english-reel.mp4
            remotion/out/hindi-reel.mp4
          if-no-files-found: error
          retention-days: 7
