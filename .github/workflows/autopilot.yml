
name: Instagram Reel Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate Reel content
        run: |
          claude -p "Read auto-generate/config.yml and create an original Instagram Reel for my niche.

          Return ONLY valid JSON matching this exact structure:
          {
            \"handle\": \"@yourbusiness\",
            \"slides\": [
              {\"kind\":\"hook\",\"tag\":\"AI TOOLS\",\"headline\":\"Your opening hook\"},
              {\"kind\":\"tool\",\"n\":1,\"headline\":\"Tool name\",\"emphasis\":\"Key benefit\",\"body\":\"Short explanation\"},
              {\"kind\":\"tool\",\"n\":2,\"headline\":\"Another tool\",\"emphasis\":\"Key benefit\",\"body\":\"Short explanation\"},
              {\"kind\":\"tool\",\"n\":3,\"headline\":\"Practical tip\",\"emphasis\":\"Key benefit\",\"body\":\"Short explanation\"},
              {\"kind\":\"cta\",\"emphasis\":\"AI\",\"body\":\"Follow for more AI tips\"}
            ]
          }

          Requirements:
          - Create 5 to 7 slides.
          - First slide must be hook.
          - Last slide must be cta.
          - Other slides must be tool.
          - Use the niche and brand voice from config.yml.
          - Use short, engaging and educational text.
          - Do not invent statistics or facts.
          - Return JSON only, without Markdown fences." \
          --output-format text \
          --dangerously-skip-permissions \
          > /tmp/reel-response.txt

      - name: Validate generated JSON
        run: |
          node <<'NODE'
          const fs = require('fs');

          const raw = fs.readFileSync('/tmp/reel-response.txt', 'utf8');
          const start = raw.indexOf('{');
          const end = raw.lastIndexOf('}');

          if (start < 0 || end <= start) {
            throw new Error('Claude did not return valid JSON');
          }

          const data = JSON.parse(raw.slice(start, end + 1));

          if (!data.handle || !Array.isArray(data.slides)) {
            throw new Error('Missing handle or slides');
          }

          if (data.slides.length < 3) {
            throw new Error('At least 3 slides are required');
          }

          const kinds = data.slides.map(s => s.kind);

          if (kinds[0] !== 'hook' || kinds[kinds.length - 1] !== 'cta') {
            throw new Error('First slide must be hook and last must be cta');
          }

          if (kinds.some(k => !['hook', 'tool', 'cta'].includes(k))) {
            throw new Error('Invalid slide type');
          }

          fs.mkdirSync('remotion/out', { recursive: true });
          fs.writeFileSync(
            'remotion/generated-carousel.json',
            JSON.stringify(data, null, 2)
          );

          console.log('Reel JSON validated successfully!');
          console.log('Slides:', data.slides.length);
          NODE

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Render Instagram Reel
        working-directory: remotion
        run: |
          npx remotion render \
            src/index.tsx \
            Reel \
            out/reel.mp4 \
            --props=./generated-carousel.json

      - name: Upload generated Reel
        uses: actions/upload-artifact@v4
        with:
          name: instagram-reel
          path: remotion/out/reel.mp4
          if-no-files-found: error
          retention-days: 7
