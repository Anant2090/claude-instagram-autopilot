
name: Generate English and Hindi Reels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate English Reel
        run: |
          PROMPT=$(cat <<'EOF'
          Read auto-generate/config.yml for the brand voice and niche.
          Create an original Instagram Reel in ENGLISH for @aiforall.daily.
          Topic: 5 useful AI websites: ChatGPT, Perplexity, Canva AI, Gamma,
          and NotebookLM.

          Return ONLY valid JSON, with this exact structure:
          {
            "handle": "@aiforall.daily",
            "slides": [
              {"kind":"hook","tag":"...","headline":"..."},
              {"kind":"tool","n":1,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":2,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":3,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":4,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":5,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"cta","emphasis":"...","body":"..."}
            ]
          }

          Rules:
          - Exactly 7 slides in the order shown.
          - Short, readable text suitable for a vertical Reel.
          - Explain each tool accurately; do not invent features or pricing.
          - Strong opening hook and clear follow CTA.
          - No Markdown fences or extra text.
          EOF
          )

          claude -p "$PROMPT" --output-format text \
            --dangerously-skip-permissions \
            > /tmp/english-response.txt

      - name: Generate Hindi Reel
        run: |
          PROMPT=$(cat <<'EOF'
          Read auto-generate/config.yml for the brand voice and niche.
          Create an original Instagram Reel in HINDI for @aiforall.daily.
          Topic: 5 useful AI websites: ChatGPT, Perplexity, Canva AI, Gamma,
          and NotebookLM.

          Return ONLY valid JSON, with this exact structure:
          {
            "handle": "@aiforall.daily",
            "slides": [
              {"kind":"hook","tag":"...","headline":"..."},
              {"kind":"tool","n":1,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":2,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":3,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":4,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"tool","n":5,"headline":"...","emphasis":"...","body":"..."},
              {"kind":"cta","emphasis":"...","body":"..."}
            ]
          }

          Rules:
          - Exactly 7 slides in the order shown.
          - Write all spoken-style text in natural Hindi using Devanagari.
          - Keep product names such as ChatGPT and Perplexity in English.
          - Short, readable text suitable for a vertical Reel.
          - Explain each tool accurately; do not invent features or pricing.
          - Strong opening hook and clear follow CTA.
          - No Markdown fences or extra text.
          EOF
          )

          claude -p "$PROMPT" --output-format text \
            --dangerously-skip-permissions \
            > /tmp/hindi-response.txt

      - name: Validate both Reel scripts
        run: |
          node <<'NODE'
          const fs = require('fs');

          function parseAndValidate(input, output) {
            const raw = fs.readFileSync(input, 'utf8');
            const start = raw.indexOf('{');
            const end = raw.lastIndexOf('}');

            if (start < 0 || end <= start) {
              throw new Error(`No JSON found in ${input}`);
            }

            const data = JSON.parse(raw.slice(start, end + 1));

            if (data.handle !== '@aiforall.daily') {
              throw new Error(`Incorrect handle in ${input}`);
            }

            if (!Array.isArray(data.slides) || data.slides.length !== 7) {
              throw new Error(`Expected exactly 7 slides in ${input}`);
            }

            const kinds = data.slides.map(slide => slide.kind);
            if (kinds[0] !== 'hook' || kinds[6] !== 'cta') {
              throw new Error(`Invalid first or last slide in ${input}`);
            }

            if (kinds.slice(1, 6).some(kind => kind !== 'tool')) {
              throw new Error(`Expected five tool slides in ${input}`);
            }

            for (const slide of data.slides) {
              for (const field of ['headline', 'emphasis', 'body']) {
                if (field in slide && typeof slide[field] !== 'string') {
                  throw new Error(`Invalid ${field} in ${input}`);
                }
              }
            }

            fs.writeFileSync(output, JSON.stringify(data, null, 2));
            console.log(`Validated ${output}`);
          }

          fs.mkdirSync('remotion/out', { recursive: true });
          parseAndValidate('/tmp/english-response.txt',
            'remotion/english-carousel.json');
          parseAndValidate('/tmp/hindi-response.txt',
            'remotion/hindi-carousel.json');
          NODE

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Render English Reel
        working-directory: remotion
        run: |
          npx remotion render src/index.tsx Reel \
            out/english-reel.mp4 \
            --props=./english-carousel.json

      - name: Render Hindi Reel
        working-directory: remotion
        run: |
          npx remotion render src/index.tsx Reel \
            out/hindi-reel.mp4 \
            --props=./hindi-carousel.json

      - name: Upload both Reels
        uses: actions/upload-artifact@v4
        with:
          name: ai-for-all-english-and-hindi-reels
          path: |
            remotion/out/english-reel.mp4
            remotion/out/hindi-reel.mp4
          if-no-files-found: error
          retention-days: 7
