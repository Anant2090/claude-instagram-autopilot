# Instagram Autopilot Configuration
# AI-powered content generation for @aiforall.daily

niche: "AI tools, automation, technology and productivity"

brand:
  handle: "@aiforall.daily"
  voice: "Clear, practical, curious and beginner-friendly. Explain technical ideas in simple language. Prefer useful demonstrations over hype. Keep sentences natural when spoken. Do not invent metrics, testimonials, pricing, features or results."
  audience: "Students, working professionals, creators and small-business owners who want to use AI practically."
  pillars:
    - "Useful AI tools and websites"
    - "AI tools for students and professionals"
    - "ChatGPT tips and practical workflows"
    - "AI automation tutorials"
    - "AI productivity and time-saving workflows"
    - "AI news explained with verified context"
    - "Beginner-friendly AI concepts"
    - "Honest tool comparisons"

cta:
  default: "Follow @aiforall.daily for practical AI tools and tutorials."
  keyword: "AI"
  deliverable: "Free AI tools collection and automation guide"

cadence:
  timezone: "Asia/Kolkata"
  slots_per_day: 1

guardrails:
  - "Human approval is required before publishing."
  - "Never invent statistics, prices, capabilities, testimonials or outcomes."
  - "Label simulated demos as illustrative simulations."
  - "Verify time-sensitive product claims before using them."
  - "Model content formats, never copy another creator's script or video."
