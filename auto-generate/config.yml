
# Instagram Autopilot Configuration
# AI-powered faceless Instagram content generation

niche: "AI tools, automation, technology and productivity"

brand:
  handle: "@YOUR_INSTAGRAM_USERNAME"
  voice: "Engaging, simple, confident, educational and practical. Use powerful hooks, short sentences and actionable advice. Avoid hype and fake claims."
  pillars:
    - "Best free AI tools and websites"
    - "AI tools that save time and money"
    - "ChatGPT tips and tricks"
    - "AI automation tutorials"
    - "Latest artificial intelligence developments"
    - "AI tools for students and professionals"
    - "Practical business automation"
    - "Underrated AI websites"

cta:
  keyword: "AI"
  deliverable: "Free AI tools collection and automation guide"

cadence:
  timezone: "Asia/Kolkata"
  slots_per_day: 1

# Content requirements:
# Create original, educational and engaging content.
# Use strong hooks in the first 3 seconds.
# Create vertical 9:16 Instagram Reels.
# Keep videos concise and visually engaging.
# Include captions, subtitles and a clear CTA.
# Never invent statistics, facts or results.
# Require human approval before publishing.
